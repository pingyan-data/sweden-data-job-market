name: weekly-fetch

# 每周一 06:00 UTC（夏令时约等于斯德哥尔摩 08:00）自动跑一次，
# 也可以在 GitHub 的 Actions 标签页手动点 "Run workflow" 触发测试。
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

# 让这个 job 有权限把抓到的数据 commit 回 repo
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 这里我固定用 3.12（CI 上最稳，所有包都有 wheel）。
          # 如果你想让 CI 和你本地 3.14 完全一致，把下面改成 "3.14"。
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser (Klarna fetcher needs it)
        # --with-deps 会顺带装 Linux 上无头浏览器需要的系统库
        run: python -m playwright install --with-deps chromium

      - name: Run fetchers
        run: |
          python src/fetch_jobtech.py
          python src/fetch_lever.py
          python src/fetch_greenhouse.py
          python src/fetch_ashby.py
          python src/fetch_teamtailor.py
          python src/fetch_klarna.py
          python src/fetch_thehub.py

      - name: Filter PRIMARY
        run: python src/filter_ads.py

      - name: Commit new snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: weekly snapshot $(date +%F)" || echo "No changes to commit"
          git push
