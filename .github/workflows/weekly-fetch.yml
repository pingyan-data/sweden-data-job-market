name: weekly-fetch

# Run every Monday at 06:00 UTC; enable manual dispatch from the Actions tab
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

# Grant write access for committing fetched snapshots
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pin to 3.12 for CI stability; switch to "3.14" to match the local environment
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Invoke through "python -m" to bypass PATH lookup; install Chromium and required OS libraries
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run fetchers
        run: |
          python src/fetch_jobtech.py
          python src/fetch_lever.py
          python src/fetch_greenhouse.py
          python src/fetch_ashby.py
          python src/fetch_teamtailor.py
          python src/fetch_klarna.py
          python src/fetch_thehub.py

      - name: Filter and tag primary ads
        run: python src/filter_ads.py

      - name: Commit snapshot
        # Skip the commit when nothing changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: weekly snapshot $(date +%F)" || echo "No changes to commit"
          git push
